# Report style: a configurable answer format (G2 class f, report style), never what an answer concludes or which basis a
# number is taken on. The policy names the style it uses (reporting.profile); a user or dataset can supply its own, and
# the run option --format default ignores it (the zone table is then by_curve).
format:
  zone_table: by_interval      # code-composed table: one row per interval, first column "Depth Interval (<unit>)"
