# Provenance of hydrocarbon_detection's lines (skills/README.md, 'Provenance'): one row per Decide, Know, Easily misread and Do not state line, in order.
# class: a literature (refs required) | g general guideline | b workflow fact. verified (rows with numbers, where the review set it):
#   textbook (a widely documented value) | opened (checked in the opened source) | softened (worded as varying by source).
# refs: keys of skills/refs.yaml, with the chapter or topic cited.
# Written from the literature and reviewed line by line against rules A-G (skills/README.md).
decide:
- class: a
  refs:
  - Archie1942
  - AK2004
  - SLB-Archie
  note: 'Resistivity index I = Rt/Ro from Archie. The closest tool here is named (a guide names only methods the harness
    can run).'
- class: a
  refs:
  - KGS-PfEFFER3
  - AK2004
  note: 'KGS opened: compare zones at similar porosity (pay plots at much higher resistivity than water leg at similar porosity).
    Zone-matching rule is a general guideline.'
- class: a
  refs:
  - SLB-Rwa
  - AK2004
  verified: opened
  note: 'SLB opened: Rwa = phi^m Rt; Rwa > 3 Rw rule of thumb for producible hydrocarbons. Reviewer re-opened SLB
    ''Rwa'': ''if Rwa > 3 * Rw, then there are producible hydrocarbons'' (rule of thumb). The guide says ''a
    service-company glossary'' for SLB (the name stays in refs) and ''values vary''. The closest tool here is named (a
    guide names only methods the harness can run).'
- class: a
  refs:
  - AAPG-DN
  - SLB-NeutronPor
  - GaymardPoupon1968
  - ES2007
  note: Crossover as gas indicator (AAPG snippet); controls on its size.
- class: a
  refs:
  - Pickett1963
  - CREWES-VpVs
  - ES2007
  note: Vp/Vs lowered by gas, raised by shale (CREWES and other snippets); gas thresholds in the literature vary (about 1.58-1.8),
    so a same-zone trend is used instead.
- class: a
  refs:
  - Buckles1965
  - KGS-PfEFFER4
  - KGS-PfEFFER7
  note: 'KGS opened: zones on the BVWi trend expected water-free; higher BVW water-cut; transition displaced to higher BVW.'
- class: g
  refs: []
  note: Independence-weighted evidence and verbal confidence grading are harness reasoning guidelines, not a published standard.
- class: a
  refs:
  - Worthington2010
  - VOCAB
  note: Cutoff-based flags; cutoff choice varies (Worthington 2010, not opened; Crain net pay pages login-gated).
- class: g
  refs: []
  note: 'Harness format line: the answer''s shape beside this guide''s criteria, in the five ask forms (format only: how
    a finding and a criterion not met are reported, with their grade); no conclusion.'
