# The literature the skills' provenance cites: one entry per key (a sources.yaml row cites the key, optionally followed
# by the chapter or topic cited: "Mavko2009 (Vp-Vs relations)"). Not model-facing.
# The area guides' references and the common guides' (answer: gum2008, Jensen2000), in one file.
# - An entry is the reference, or, where areas cite one work with different entries (the chapters cited, what the
#   reviewer opened), each citing guide's entry under its name.
# - One key per work: AsquithKrygowski2004 = AK2004, EllisSinger2007 = ES2007, API_RP40_1998 = APIRP40, SLB-Excavation =
#   SLB-excavation-effect, SLB-Charts = SLB-charts, SLB1989 = SLB-LIP1989, jensen2000 = Jensen2000.
# - Access, as the reviewer recorded it: [opened] the page was fetched and read ('[opened by reviewer: ...]' says
#   what was checked); [snippet] seen only as a search-result summary; [text] a standard text cited by chapter or
#   topic from prior knowledge.
