# Provenance of water_saturation's lines (skills/README.md, 'Provenance'): one row per Decide, Know, Easily misread and Do not state line, in order.
# class: a literature (refs required) | g general guideline | b workflow fact. verified (rows with numbers, where the review set it):
#   textbook (a widely documented value) | opened (checked in the opened source) | softened (worded as varying by source).
# refs: keys of skills/refs.yaml, with the chapter or topic cited.
# Written from the literature and reviewed line by line against rules A-G (skills/README.md).
decide:
- class: a
  refs:
  - SLB-SatEq
  - Archie1942
  - Worthington1985
  note: 'SLB entry opened: Archie valid for very little clay or very high salinity with regular pore structure.'
- class: a
  refs:
  - SLB-SatEq
  - Simandoux1963
  - BardonPied1969
  - PouponLeveaux1971
  - WaxmanSmits1968
  - Clavier1984
  - Worthington1985
  note: SLB groups Vsh models (Simandoux, laminated, Indonesian) vs counter-ion models (Waxman-Smits, Dual Water, SGS).
- class: a
  refs:
  - Poupon1954
  - ThomasStieber1975
  - Worthington1985
  note: Laminated vs dispersed shale models; distribution from density-neutron (Thomas-Stieber).
- class: a
  refs:
  - AK2004
  - SLB-Pickett
  - SLB-EWR
  - KGS-PfEFFER3
  note: 'Rw sources; order of directness is a general judgement (class g element). KGS: check Pickett Rw against measured
    water resistivities.'
- class: a
  refs:
  - SLB-Archie
  - Winsauer1952
  - AK2004
  - FockeMunn1987
  - Aguilera1976
  - SLB-PorExp
  verified: textbook
  note: 'Humble a=0.62 m=2.15 (Winsauer et al.); Tixier a=0.81 m=2 (AK2004); vugs raise m (Focke and Munn); fractures lower
    m (Aguilera). SLB porosity exponent (snippet): different m per pore type.'
- class: a
  refs:
  - SLB-SatExp
  - Anderson1986
  verified: opened
  note: 'SLB entry opened: typical n 2; n increases if any pores are oil-wet; up to 8 reported. Reviewer opened SLB ''saturation
    exponent'': typical 2; n increases if any pores are oil-wet; up to 8 in very oil-wet rocks.'
- class: a
  refs:
  - Arps1953
  - AK2004
  verified: textbook
  note: Arps formula in F (+6.77) and C (+21.5) forms; BHT under-reading is textbook.
- class: a
  refs:
  - Buckles1965
  - KGS-PfEFFER4
  - KGS-PfEFFER7
  - SLB-IrrWater
  note: 'KGS opened: BVWi constant for limited pore-size range; capillary-pressure mapping. NMR bound fluid is a general alternative.'
- class: g
  refs: []
  note: 'Harness format line: the answer''s shape beside this guide''s criteria, in the five ask forms (format only: how
    a finding and a criterion not met are reported, with their grade); no conclusion.'
