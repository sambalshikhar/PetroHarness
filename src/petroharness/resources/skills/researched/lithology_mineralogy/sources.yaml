# Provenance of lithology_mineralogy's lines (skills/README.md, 'Provenance'): one row per Decide, Know, Easily misread and Do not state line, in order.
# class: a literature (refs required) | g general guideline | b workflow fact. verified (rows with numbers, where the review set it):
#   textbook (a widely documented value) | opened (checked in the opened source) | softened (worded as varying by source).
# refs: keys of skills/refs.yaml, with the chapter or topic cited.
# Written from the literature and reviewed line by line against rules A-G (skills/README.md).
decide:
- class: a
  refs:
  - AK2004 (lithology and porosity crossplot chapter)
  - SLB-charts (density-neutron crossplot charts)
  - SLB-LIP1989 (lithology and porosity)
  note: Standard neutron-density crossplot; gas, shale and evaporite displacement directions.
- class: a
  refs:
  - AK2004 (crossplot chapter)
  - ES2007 (litho-density and PEF)
  - Doveton1994 (lithology from crossplots)
  note: Sonic misses isolated vugs, so sonic porosity is lower than neutron-density porosity in vuggy rock.
- class: a
  refs:
  - Doveton1994
  - 'SLB-charts (MID plot: RHOmaa against Umaa)'
  - ES2007 (litho-density interpretation)
  note: 'Apparent matrix (MID) method; U is approximated with RHOB in place of electron density. The closest tool here
    is named (a guide names only methods the harness can run).'
- class: a
  refs:
  - 'AK2004 (crossplot chapter: M-N plot)'
  - SLB-charts (M-N plot)
  - SLB-LIP1989
  verified: textbook
  note: 'Factor 0.01 applies to DTC in us/ft and RHOB in g/cc. Secondary porosity raises M (Schlumberger chart notes).
    The closest tool here is named (a guide names only methods the harness can run).'
- class: a
  refs:
  - Doveton1994 (compositional analysis by linear algebra)
  - MayerSibbit1980
  note: 'Reconstruction error and endpoint sensitivity are standard solver checks. The closest tool here is named (a
    guide names only methods the harness can run).'
- class: g
  refs: []
  note: Support/against framing for a label-versus-log check.
- class: a
  refs:
