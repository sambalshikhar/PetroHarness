# Provenance of log_facies_stratigraphy's lines (skills/README.md, 'Provenance'): one row per Decide, Know, Easily misread and Do not state line, in order.
# class: a literature (refs required) | g general guideline | b workflow fact. verified (rows with numbers, where the review set it):
#   textbook (a widely documented value) | opened (checked in the opened source) | softened (worded as varying by source).
# refs: keys of skills/refs.yaml, with the chapter or topic cited.
# Written from the literature and reviewed line by line against rules A-G (skills/README.md).
decide:
- class: a
  refs:
  - SEPM-log-response
  - RK2011 (facies, sequences and depositional environments from logs)
  - Serra1985
  note: Shape vocabulary and smooth/serrated character from SEPM Strata (opened) and Rider and Kennedy.
- class: g
  refs:
  - Jensen2000 (regression and its uncertainty)
  note: Signal-against-noise test for a trend; the threshold is the analyst's choice.
- class: a
  refs:
  - RK2011 (bed boundaries and vertical resolution)
  - IODP180
  note: Midpoint (half-amplitude, inflection) boundary picking.
- class: a
  refs:
  - SerraAbbott1982
  - Doveton1994 (electrofacies and cluster analysis)
  - YeRabiller2000
  note: 'MRGC = multi-resolution graph-based clustering. The closest tool here is named (a guide names only methods the
    harness can run).'
- class: a
  refs:
  - VanWagoner1990
  - EmeryMyers1996 (well-log expression of systems tracts and parasequence sets)
- class: a
  refs:
  - Cant1992
  - Selley1985
  - RK2011 (facies from logs)
  note: These sources treat shape as one line of evidence among several.
- class: g
  refs:
