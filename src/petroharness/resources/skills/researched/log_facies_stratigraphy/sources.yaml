- class: a
  refs:
  - SEPM-log-response
  - RK2011
  - Cant1992
  note: 'SEPM: cleaning-up = gradual upward decrease in gamma; dirtying-up = gradual upward increase; boxcar = low gamma,
    sharp boundaries, no internal change; bow = decrease then increase.'
- class: a
