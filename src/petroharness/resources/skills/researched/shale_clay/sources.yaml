# Provenance of shale_clay's lines (skills/README.md, 'Provenance'): one row per Decide, Know, Easily misread and Do not state line, in order.
# class: a literature (refs required) | g general guideline | b workflow fact. verified (rows with numbers, where the review set it):
#   textbook (a widely documented value) | opened (checked in the opened source) | softened (worded as varying by source).
# refs: keys of skills/refs.yaml, with the chapter or topic cited.
# Written from the literature and reviewed line by line against rules A-G (skills/README.md).
decide:
- class: a
  refs:
  - AK2004 ch. 3 (gamma ray index)
  - Crain (shale volume chapter)
  verified: softened
  note: 'IGR definition from AK2004 ch. 3. Percentile and histogram baseline picks are common practice; the choice of percentiles
    varies. Reviewer: 5th and 95th percentiles given as an example of practice, not a standard.'
- class: a
  refs:
  - AK2004 ch. 3 (Larionov)
  - Larionov1969
  - Stieber1970
  - Clavier1971
