  note: Neutron-density shale indicator; gas and matrix caveats follow from neutron and density physics.
- class: a
  refs:
  - 'AK2004 ch. 2 (SP: shale volume from SP)'
  - Bassiouni1994 (SP chapter)
  note: PSP = pseudo-static SP; SSP = static SP.
- class: a
  refs:
  - RK2011 (spectral gamma ray chapter)
