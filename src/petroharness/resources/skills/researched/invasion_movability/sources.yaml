  note: 'ND GI-48 (opened by reviewer) quoting Asquith 1982: Sw/Sxo >= 1 no hydrocarbons moved; < 0.7 sandstone, < 0.6
    carbonates moveable hydrocarbons indicated. KGS PfEFFER 9: Sxo by Archie with Rmf and Rxo. The guide says ''values
    vary''.'
