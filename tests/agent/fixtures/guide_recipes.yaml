    5: {starts: "Where uranium is high,", calls: ["stats GR, SGR, CGR, THOR, POTA, URAN"]}
    6: {starts: "Combine indicators: each is", calls: [step vclay, section lithology.clay_content_indicators]}
    7: {starts: "Clay distribution: plot PHIT", calls: [crossplot PHIT VCL]}
    8: {starts: "Answer shape: quantify (values", none: "not a test: the shape of the answer beside the criteria (format)"}
