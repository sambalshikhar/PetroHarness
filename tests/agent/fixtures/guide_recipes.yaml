    3: {starts: "Density-neutron combinations: arithmetic", calls: ["stats PHID, PHIN, PHIS, PHIT, PEF", step porosity]}
    4: {starts: "Shale corrections: subtract VCL", calls: [step porosity]}
    5: {starts: "Sonic transforms: Wyllie time-average", calls: [step porosity]}
    6: {starts: "Read PHI_SEC (PHIT −", calls: ["stats DS_SEPARATION, PHI_SEC", section porosity.pore_system_architecture_classification]}
