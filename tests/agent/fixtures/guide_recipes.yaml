    2: {starts: "Could GR be raised", calls: ["stats GR, SGR, CGR, THOR, POTA, URAN"]}
    3: {starts: "Do independent indicators (GR,", calls: ["stats VCL, GR, NPHI", compare PHIN PHID, section lithology.clay_content_indicators]}
    4: {starts: "How does porosity (PHIT,", calls: [crossplot PHIT VCL, "stats PHIT, PHIE, VCL"]}
