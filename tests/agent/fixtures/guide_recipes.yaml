# The test-to-recipe review of the researched library's area guides. Every Consider and Decide line has an entry, by
# part and number:
#   calls: the guide's Compare calls that run the test the line describes (the call as written before its note);
#   none: why the line has no recipe: "not a test: ..." (a question about the record the map answers, or method
#         knowledge), or "data: ..." (the test needs data no record of the configured datasets holds; kept as what
#         would settle the reading).
# A line whose test no tool can run on the record says the closest tool ("Closest here: ...": a guide names only methods
# the harness can run); its entry pairs that tool where the guide lists it. tests/agent/test_recipes.py checks every
# entry against the guides.
data_quality:
  consider:
    1: {starts: "Which curves exist in", calls: [data_record, section numerical.statistical_data_coverage_analysis]}
    2: {starts: "Where does CALI depart", calls: ["stats CALI, BS, DRHO", runs BAD_HOLE, "spike_flags GR, RHOB, NPHI, DTC"]}
    3: {starts: "Which curves come from", calls: [stats CURVES where CONDITION]}
    4: {starts: "What mud was used", none: "not a test: the mud type is a header fact the map shows where the LAS states it"}
    5: {starts: "Do curves from different", calls: ["lag_correlation GR, RHOB, NPHI, DTC"], none: "data: a repeat pass, which no record holds"}
    6: {starts: "Which derived curves (PHID,", calls: [stats CURVES where CONDITION]}
  decide:
    1: {starts: "Screen hole condition with", calls: ["stats CALI, BS, DRHO", runs BAD_HOLE, section numerical.log_quality_control_assessment]}
    2: {starts: "Assess zone statistics by", calls: [data_record, stats CURVES where CONDITION]}
    3: {starts: "Tell artefacts from thin", calls: ["spike_flags GR, RHOB, NPHI, DTC"]}
    4: {starts: "Flag outliers per zone", calls: ["spike_flags GR, RHOB, NPHI, DTC", section numerical.statistical_deviation_detection]}
    5: {starts: "Screen sonic: DTC slower", calls: [adjacent_jumps CURVE threshold=VALUE, "spike_flags GR, RHOB, NPHI, DTC"]}
    6: {starts: "Depth-match against one reference", calls: ["lag_correlation GR, RHOB, NPHI, DTC"]}
    7: {starts: "Compare curves at a", calls: [runs BAD_HOLE]}
    8: {starts: "Trace a data problem", calls: [stats CURVES where CONDITION, runs BAD_HOLE]}
    9: {starts: "Answer shape: locate (depth", none: "not a test: the shape of the answer beside the criteria (format)"}
lithology_mineralogy:
  consider:
    1: {starts: "What label does each", calls: ["stats GR, RHOB, NPHI, PEF, DTC", "lithology_stats GR, RHOB, NPHI, PEF"]}
    2: {starts: "Is PEF usable here", calls: ["stats GR, RHOB, NPHI, PEF, DTC"], none: "data: the mud weight and type where the header lacks them"}
    3: {starts: "On neutron-density, PEF-density, M-N", calls: [crossplot RHOB NPHI, crossplot PEF RHOB]}
    4: {starts: "How much shale (VCL)", calls: [compare PHID PHIN]}
    5: {starts: "Which minerals did the", calls: [step lithology, "stats VQUAR, VCALC, VDOLO, VANHY"]}
    6: {starts: "Between zones, do medians", calls: ["stats GR, RHOB, NPHI, PEF, DTC", crossplot RHOB NPHI]}
  decide:
    1: {starts: "Neutron-density crossplot with matched", calls: [crossplot RHOB NPHI, compare PHID PHIN]}
    2: {starts: "Break neutron-density ambiguity with", calls: [crossplot PEF RHOB, "lithology_stats GR, RHOB, NPHI, PEF"]}
    3: {starts: "Apparent matrix values, with", calls: ["stats GR, RHOB, NPHI, PEF, DTC"], none: "no tool computes it sample by sample; the line names calc on zone means"}
    4: {starts: "M-N plot: M =", calls: ["stats GR, RHOB, NPHI, PEF, DTC"], none: "no tool computes it sample by sample; the line names calc on zone means"}
    5: {starts: "Mineral solver output: treat", calls: [step lithology, "stats VQUAR, VCALC, VDOLO, VANHY"]}
    6: {starts: "Checking a label against", calls: [section lithology.lithology_log_consistency, "lithology_stats GR, RHOB, NPHI, PEF"]}
    7: {starts: "Carbonate against clastic: PEF,", calls: [section lithology.carbonate_analysis, crossplot PEF RHOB]}
    8: {starts: "Evaporites, coal and heavy", calls: ["stats GR, RHOB, NPHI, PEF, DTC"]}
    9: {starts: "Answer shape: classify (units", none: "not a test: the shape of the answer beside the criteria (format)"}
