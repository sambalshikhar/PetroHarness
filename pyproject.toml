[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "petroharness"
version = "1.3.0"
description = "Answers petrophysics questions about an interval of a well from its raw LAS: Petrophys calculates, the harness investigates and records, a language model interprets"
readme = "README.md"
license = "CC-BY-4.0"
license-files = ["LICENSE", "THIRD_PARTY_DATA.md"]
authors = [{name = "PetroHarness Contributors"}]
keywords = ["petrophysics", "formation evaluation", "well logs", "LAS", "LLM", "agents", "geoscience"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "petrophys==3.0.0",      # the Petrophys release it is tested with (PyPI)
    "langgraph>=1.2",
    "lasio",                 # LAS header read (depth unit) without the data section
    "numpy",
    "pandas",
    "pydantic>=2.6",
    "pyyaml",
    "openai>=1.40",
]

[project.urls]
Homepage = "https://welllogbench.com/petroharness/"
Documentation = "https://welllogbench.com/petroharness/docs/"
Repository = "https://github.com/sambalshikhar/PetroHarness"
Issues = "https://github.com/sambalshikhar/PetroHarness/issues"
Changelog = "https://github.com/sambalshikhar/PetroHarness/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist", "ruff"]

[project.scripts]
petroharness = "petroharness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
petroharness = ["py.typed", "resources/**/*", "agent/components/**/*", "ui/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "tests/agent"]
addopts = "-q"
markers = [
    "data: needs the data files named in the data config (configs/data.local.yaml or PETROHARNESS_DATA)",
    "llm: needs a live model endpoint",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# What must never land: syntax errors, names that do not exist, comparisons that cannot be meant, unused imports.
# Style is the reviewer's.
select = ["E9", "F63", "F7", "F82", "F401"]

